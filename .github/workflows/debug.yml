name: Sonora Debug

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonora-debug
  cancel-in-progress: true

jobs:
  debug:
    name: Build and send debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: sonora-debug-keystore-v1

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Install Telegram uploader
        run: python3 -m pip install --disable-pip-version-check "Telethon==1.45.0"

      - name: Build debug APK
        run: python3 .github/scripts/debug.py build

      - name: Package debug APK
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/debug.py package

      - name: Send debug APK to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/debug.py telegram
